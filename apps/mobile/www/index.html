<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Clipzy</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0e0e10;color:#f4f4f5;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1f6feb,#1a5fd0);display:grid;place-items:center;margin:0 auto}
.logo i{width:0;height:0;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
h1{font-size:22px;margin:16px 0 4px}p{color:#a1a1aa;margin:0 0 20px}
button{padding:12px 28px;border:0;border-radius:10px;background:#1f6feb;color:#fff;font-weight:600;font-size:16px}</style></head>
<body><div><div class="logo"><i></i></div><h1>Can’t reach Clipzy</h1><p>Check your internet connection and try again.</p><button onclick="location.reload()">Try again</button></div>
<script>window.addEventListener('online', function () { location.reload(); });</script></body></html>
